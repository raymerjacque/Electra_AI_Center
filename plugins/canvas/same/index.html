<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Same-Game</title>
<style>
  :root {
    --panel-bg: rgba(14, 16, 20, 0.92);
    --panel-border: rgba(0, 210, 255, 0.22);
    --accent: #00d2ff;
    --text: rgba(225, 230, 235, 0.92);
    --text-dim: rgba(170, 178, 185, 0.65);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0a0c10;
    overflow: hidden;
    font-family: 'Ubuntu', 'Cantarell', 'Segoe UI', sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ── The 10% buffer: plugin content never touches the screen edges ──────── */
  .stage {
    width: 100vw;
    height: 100vh;
    padding: 10vh 10vw;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 3vw;
  }

  .board-wrap {
    /* 5:3 widescreen rectangle (wider than tall), not a square. The width
       formula accounts for the actual layout budget — stage padding (10vw
       each side), the gap to the side panel (3vw), and the panel's own
       fixed width (240px) — so the board fills the real available space
       rather than guessing a raw vw number that could overflow past the
       side panel. The height formula is exactly (width * 3/5), kept
       consistent across both possible binding constraints so cells stay
       perfectly round rather than stretching into ovals. */
    width: min(calc(77vw - 240px), 130vh);
    height: min(calc((77vw - 240px) * 0.6), 78vh);
    background: #14181f;
    border-radius: 16px;
    box-shadow: 0 14px 44px rgba(0,0,0,0.55);
    border: 2px solid rgba(0, 210, 255, 0.22);
    padding: 10px;
    position: relative;
  }

  .board {
    width: 100%;
    height: 100%;
    display: grid;
    position: relative;
  }

  .cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ball {
    width: 82%;
    height: 82%;
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
    box-shadow: 0 3px 6px rgba(0,0,0,0.45), inset 0 -3px 6px rgba(0,0,0,0.25);
    animation: popIn 0.16s ease;
  }
  @keyframes popIn {
    from { transform: scale(0.4); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .ball.color-0 { background: radial-gradient(circle at 32% 28%, #ff8fa3, #e63950 58%, #a3102b 100%); }
  .ball.color-1 { background: radial-gradient(circle at 32% 28%, #8fc4ff, #2f8fe6 58%, #0d4d99 100%); }
  .ball.color-2 { background: radial-gradient(circle at 32% 28%, #a3f7c0, #3ecf6e 58%, #157a3d 100%); }
  .ball.color-3 { background: radial-gradient(circle at 32% 28%, #ffe28a, #f2b705 58%, #b38200 100%); }

  .ball.hoverable:hover,
  .ball.group-hover {
    transform: scale(1.14);
    filter: brightness(1.25);
    box-shadow: 0 0 14px 3px currentColor, 0 3px 6px rgba(0,0,0,0.45);
    z-index: 2;
  }
  .ball.color-0.group-hover, .ball.color-0.hoverable:hover { color: rgba(230,57,80,0.9); }
  .ball.color-1.group-hover, .ball.color-1.hoverable:hover { color: rgba(47,143,230,0.9); }
  .ball.color-2.group-hover, .ball.color-2.hoverable:hover { color: rgba(62,207,110,0.9); }
  .ball.color-3.group-hover, .ball.color-3.hoverable:hover { color: rgba(242,183,5,0.9); }

  /* ── Side panel ───────────────────────────────────────────────────────── */
  .side-panel {
    width: 240px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .stat-card {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 14px 18px;
    box-shadow: 0 8px 26px rgba(0,0,0,0.4);
  }
  .stat-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .stat-value.high { color: #ffd23c; }

  .new-game-btn {
    background: rgba(0, 210, 255, 0.14);
    border: 1px solid rgba(0, 210, 255, 0.4);
    border-radius: 10px;
    color: var(--accent);
    font-size: 14px;
    font-weight: 700;
    padding: 12px;
    cursor: pointer;
  }
  .new-game-btn:hover { background: rgba(0, 210, 255, 0.24); }

  .legend {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 14px 18px;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.7;
  }
  .legend-title {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .legend-row { display: flex; justify-content: space-between; }
  .legend-row span:last-child { color: var(--text); font-weight: 600; }

  .status-msg {
    font-size: 13px;
    color: var(--text-dim);
    min-height: 18px;
  }
  .status-msg.over { color: #ff8a8a; font-weight: 700; }
  .status-msg.cleared { color: #7bd88f; font-weight: 700; }
  .status-msg.newhigh { color: #ffd23c; font-weight: 700; }

  /* ── Game over overlay ────────────────────────────────────────────────── */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(5, 6, 9, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay-box { color: var(--text); }
  .overlay-title {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .overlay-title.cleared-title { color: #7bd88f; }
  .overlay-sub { font-size: 14px; color: var(--text-dim); margin-bottom: 18px; }
  .overlay-sub.newhigh { color: #ffd23c; font-weight: 700; }
</style>
</head>
<body>
<div class="stage">
  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <div class="overlay-box">
        <div class="overlay-title" id="overlayTitle">Game Over</div>
        <div class="overlay-sub" id="overlaySub">Final score: 0</div>
        <button class="new-game-btn" id="overlayNewGameBtn">Play Again</button>
      </div>
    </div>
  </div>

  <div class="side-panel">
    <div class="stat-card">
      <div class="stat-label">Score</div>
      <div class="stat-value" id="scoreValue">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">High Score</div>
      <div class="stat-value high" id="highScoreValue">0</div>
    </div>
    <button class="new-game-btn" id="newGameBtn">New Game</button>
    <div class="status-msg" id="statusMsg"></div>
    <div class="legend">
      <div class="legend-title">Scoring</div>
      <div class="legend-row"><span>2 balls</span><span>1 pt</span></div>
      <div class="legend-row"><span>3 balls</span><span>2 pts</span></div>
      <div class="legend-row"><span>4 balls</span><span>5 pts</span></div>
      <div class="legend-row"><span>5 balls</span><span>10 pts</span></div>
      <div class="legend-row"><span>6 balls</span><span>15 pts</span></div>
      <div class="legend-row"><span>7+ balls</span><span>+5 each</span></div>
    </div>
  </div>
</div>

<script>
"use strict";

// ═══════════════════════════════════════════════════════════════════════════
// Pure game engine (DOM-free, independently testable under Node)
// ═══════════════════════════════════════════════════════════════════════════

const ROWS = 12;
const COLS = 20;
const NUM_COLORS = 4;

function createBoard(rows, cols, numColors, rand) {
  rand = rand || Math.random;
  const board = [];
  for (let r = 0; r < rows; r++) {
    const row = [];
    for (let c = 0; c < cols; c++) {
      row.push(Math.floor(rand() * numColors));
    }
    board.push(row);
  }
  return board;
}

function cloneBoard(board) {
  return board.map(row => row.slice());
}

function findConnectedGroup(board, row, col) {
  const rows = board.length, cols = board[0].length;
  const color = board[row][col];
  if (color === null || color === undefined) return [];

  const key = (r, c) => r + "," + c;
  const visited = new Set([key(row, col)]);
  const stack = [[row, col]];
  const result = [[row, col]];

  while (stack.length) {
    const [r, c] = stack.pop();
    const neighbors = [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]];
    for (const [nr, nc] of neighbors) {
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
      const k = key(nr, nc);
      if (visited.has(k)) continue;
      if (board[nr][nc] === color) {
        visited.add(k);
        result.push([nr, nc]);
        stack.push([nr, nc]);
      }
    }
  }
  return result;
}

function removeCells(board, cells) {
  const next = cloneBoard(board);
  for (const [r, c] of cells) {
    next[r][c] = null;
  }
  return next;
}

function applyGravity(board) {
  const rows = board.length, cols = board[0].length;
  const next = Array.from({ length: rows }, () => Array(cols).fill(null));
  for (let c = 0; c < cols; c++) {
    const values = [];
    for (let r = 0; r < rows; r++) {
      if (board[r][c] !== null && board[r][c] !== undefined) values.push(board[r][c]);
    }
    const startRow = rows - values.length;
    for (let i = 0; i < values.length; i++) {
      next[startRow + i][c] = values[i];
    }
  }
  return next;
}

function collapseEmptyColumns(board) {
  const rows = board.length, cols = board[0].length;
  const nonEmptyCols = [];
  for (let c = 0; c < cols; c++) {
    let hasAny = false;
    for (let r = 0; r < rows; r++) {
      if (board[r][c] !== null && board[r][c] !== undefined) { hasAny = true; break; }
    }
    if (hasAny) nonEmptyCols.push(c);
  }
  const next = Array.from({ length: rows }, () => Array(cols).fill(null));
  nonEmptyCols.forEach((origCol, newCol) => {
    for (let r = 0; r < rows; r++) {
      next[r][newCol] = board[r][origCol];
    }
  });
  return next;
}

function scoreForGroup(n) {
  if (n < 2) return 0;
  const table = { 2: 1, 3: 2, 4: 5, 5: 10, 6: 15 };
  if (table[n] !== undefined) return table[n];
  return 15 + (n - 6) * 5;
}

function hasValidMoves(board) {
  const rows = board.length, cols = board[0].length;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const v = board[r][c];
      if (v === null || v === undefined) continue;
      if (c + 1 < cols && board[r][c + 1] === v) return true;
      if (r + 1 < rows && board[r + 1][c] === v) return true;
    }
  }
  return false;
}

function isBoardCleared(board) {
  for (const row of board) {
    for (const v of row) {
      if (v !== null && v !== undefined) return false;
    }
  }
  return true;
}

// Performs one full move: clear the group at (row,col) if it's 2+, apply
// gravity + column collapse, and return the resulting state. Returns null
// (no-op) if the clicked cell is empty or part of a group smaller than 2 —
// matches classic Same-Game rules (singletons can't be cleared).
function playMove(board, row, col) {
  const group = findConnectedGroup(board, row, col);
  if (group.length < 2) return null;

  let next = removeCells(board, group);
  next = applyGravity(next);
  next = collapseEmptyColumns(next);

  return {
    board: next,
    points: scoreForGroup(group.length),
    groupSize: group.length,
    cleared: isBoardCleared(next),
    gameOver: !hasValidMoves(next),
  };
}

if (typeof module !== "undefined") {
  module.exports = {
    ROWS, COLS, NUM_COLORS, createBoard, cloneBoard, findConnectedGroup,
    removeCells, applyGravity, collapseEmptyColumns, scoreForGroup,
    hasValidMoves, isBoardCleared, playMove,
  };
}

// ═══════════════════════════════════════════════════════════════════════════
// App (DOM-dependent)
// ═══════════════════════════════════════════════════════════════════════════
if (typeof document !== "undefined") {

const STORAGE_KEY = "electra_samegame_high_score";

let board = createBoard(ROWS, COLS, NUM_COLORS);
let score = 0;
let highScore = 0;
let gameActive = true;

const boardEl = document.getElementById("board");
const overlayEl = document.getElementById("overlay");
const scoreEl = document.getElementById("scoreValue");
const highScoreEl = document.getElementById("highScoreValue");
const statusEl = document.getElementById("statusMsg");

boardEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
boardEl.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;

function loadHighScore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const n = raw ? parseInt(raw, 10) : 0;
    return Number.isFinite(n) ? n : 0;
  } catch (e) {
    return 0;
  }
}

function saveHighScore(n) {
  try {
    localStorage.setItem(STORAGE_KEY, String(n));
  } catch (e) {
    console.warn("[Same-Game] Could not save high score:", e);
  }
}

function setStatus(text, cls) {
  statusEl.textContent = text || "";
  statusEl.className = "status-msg" + (cls ? " " + cls : "");
}

function render() {
  boardEl.innerHTML = "";
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const color = board[r][c];
      if (color !== null && color !== undefined) {
        const ball = document.createElement("div");
        ball.className = `ball color-${color} hoverable`;
        ball.dataset.row = r;
        ball.dataset.col = c;
        ball.addEventListener("mouseenter", onBallHoverEnter);
        ball.addEventListener("mouseleave", onBallHoverLeave);
        ball.addEventListener("click", onBallClick);
        cell.appendChild(ball);
      }
      boardEl.appendChild(cell);
    }
  }
  scoreEl.textContent = score;
  highScoreEl.textContent = highScore;
}

function onBallHoverEnter(e) {
  if (!gameActive) return;
  const r = parseInt(e.currentTarget.dataset.row, 10);
  const c = parseInt(e.currentTarget.dataset.col, 10);
  const group = findConnectedGroup(board, r, c);
  if (group.length < 2) return;
  for (const [gr, gc] of group) {
    const el = boardEl.querySelector(`[data-row="${gr}"][data-col="${gc}"]`);
    if (el) el.classList.add("group-hover");
  }
}

function onBallHoverLeave() {
  boardEl.querySelectorAll(".group-hover").forEach(el => el.classList.remove("group-hover"));
}

function onBallClick(e) {
  if (!gameActive) return;
  const r = parseInt(e.currentTarget.dataset.row, 10);
  const c = parseInt(e.currentTarget.dataset.col, 10);
  const result = playMove(board, r, c);
  if (!result) return; // singleton — no-op, matches classic rules

  board = result.board;
  score += result.points;
  render();

  if (score > highScore) {
    highScore = score;
    saveHighScore(highScore);
  }

  if (result.cleared) {
    gameActive = false;
    showOverlay(true, false);
  } else if (result.gameOver) {
    gameActive = false;
    showOverlay(false, score >= highScore && score > 0);
  } else {
    setStatus(`+${result.points} (${result.groupSize} balls)`);
  }
}

function showOverlay(cleared, isNewHigh) {
  const titleEl = document.getElementById("overlayTitle");
  const subEl = document.getElementById("overlaySub");
  if (cleared) {
    titleEl.textContent = "Board Cleared! 🎉";
    titleEl.className = "overlay-title cleared-title";
  } else {
    titleEl.textContent = "Game Over";
    titleEl.className = "overlay-title";
  }
  subEl.textContent = `Final score: ${score}`;
  subEl.className = "overlay-sub" + (isNewHigh ? " newhigh" : "");
  if (isNewHigh) {
    subEl.textContent += " — New high score!";
  }
  overlayEl.classList.add("show");
}

function newGame() {
  board = createBoard(ROWS, COLS, NUM_COLORS);
  score = 0;
  gameActive = true;
  overlayEl.classList.remove("show");
  setStatus("");
  render();
}

document.getElementById("newGameBtn").addEventListener("click", newGame);
document.getElementById("overlayNewGameBtn").addEventListener("click", newGame);

// ── Init ──────────────────────────────────────────────────────────────────
highScore = loadHighScore();
render();

}
</script>
</body>
</html>
